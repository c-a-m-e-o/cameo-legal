<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.A.M.E.O - Legal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      padding: 40px 24px;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 48px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .links a {
      display: block;
      padding: 18px 24px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }
    .links a:hover {
      background: #222;
      border-color: #444;
    }
    .links a span {
      display: block;
      font-size: 0.8rem;
      color: #666;
      margin-top: 4px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>C.A.M.E.O</h1>
    <p class="subtitle">Legal Information</p>
    <div class="links">
      <a href="privacy-policy/">
        Privacy Policy
        <span>How we handle your data</span>
      </a>
      <a href="terms-and-conditions/">
        Terms &amp; Conditions
        <span>Rules for using the app</span>
      </a>
    </div>
  </div>
</body>
</html>
